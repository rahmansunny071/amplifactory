name: Factory task
description: Work for the agent factory (you add factory:design to start it)
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done? User-visible behavior.
    validations: { required: true }
  - type: textarea
    id: context
    attributes:
      label: Context & pointers
      description: Relevant modules, formats, specs, prior issues.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable bullets. Offline-testable with synthetic fixtures.
    validations: { required: true }
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
  - type: dropdown
    id: areas
    attributes:
      label: Areas affected
      multiple: true
      options: [canonical model, claude_code reader, redaction, sts writer, openrouter writer, convomem export, convomem builder, cli, none]
