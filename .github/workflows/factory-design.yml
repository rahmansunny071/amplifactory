name: factory-design
on:
  issues:
    types: [labeled]

jobs:
  design:
    if: >
      github.event.label.name == 'factory:design' &&
      github.event.sender.login == 'rahmansunny071'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: factory-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions: { contents: write, pull-requests: write, issues: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/design-issue ${{ github.event.issue.number }}"
          claude_args: >-
            --model sonnet
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(git:*),Bash(gh issue:*),Bash(gh pr create:*),Bash(gh label:*)"
