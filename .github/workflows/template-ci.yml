            ("review", wr("edit", W + "/.factory/designs/a.md"), no),
          ]
          ENV = {k: v for k, v in os.environ.items() if k != "GITHUB_WORKSPACE"}  # the cases' cwd is the workspace
          bad = []
          for stage, payload, want in cases:
              p = subprocess.run([sys.executable, H, stage], input=json.dumps(payload), capture_output=True, text=True, env=ENV)
              if p.returncode != 0:
                  bad.append(f"{stage} {payload}: exit {p.returncode} {p.stderr[-200:]}"); continue
              denied = bool(p.stdout.strip()) and json.loads(p.stdout)["permissionDecision"] == "deny"
              if denied == want:
                  bad.append(f"{stage}: {'allowed' if want else 'denied'} expected for {json.dumps(payload['toolArgs'])[:140]}; got {p.stdout.strip()[:200]}")
          # a bad stage or payload fails, so Copilot denies
          for stage, raw in (("chat-x", json.dumps(sh("git status"))), ("design", "not json"), ("design", "{}"), ("design", json.dumps({"toolName": "bash", "toolArgs": {}}))):
              if subprocess.run([sys.executable, H, stage], input=raw, capture_output=True, text=True, env=ENV).returncode == 0:
                  bad.append(f"{stage} {raw[:60]}: exit 0, want a failure")
          for b in bad:
              print(f"::error file={H}::{b} (Python {sys.version_info[0]}.{sys.version_info[1]}, #62)")
          sys.exit(1 if bad else 0)
          PY
            done
            if grep -nE -- '--allow-all( |$)|--allow-all-(tools|urls)|--yolo|--trust-folder|COPILOT_ALLOW_ALL|id-token|npm (install|i) (.* )?(-g|--global)' \
                .github/workflows/factory-design.yml .github/workflows/factory-build.yml .github/workflows/factory-review.yml; then
              echo "::error::the Copilot workflows must not widen the agents' permissions or install the CLI globally (#40)"; fail=1
            fi
            # Actions runs steps under pipefail, so a label check piped into grep -q can read as false
            # when gh gets SIGPIPE (#99). The tool rules checks pipe a finished echo, which is safe.
            if grep -nE '^[^#]*\|[[:space:]]*grep[^|]* -[a-zA-Z]*q' .github/workflows/factory-*.yml | grep -vF "'\"deny\"'"; then
