            || { echo "::error::README.md names /install-github-app outside 'Actions mode with Claude (optional)' (#20)"; fail=1; }
          # #29: the section is the marker line and the more-indented lines under it; the next line
          # indented no deeper than the marker (the next item, EOF) ends it.
          awk '{ match($0, /^ */); i = RLENGTH
                 if ($0 ~ /Actions mode with Claude \(optional/) { s = 1; mi = i } else if (s && NF && i <= mi) s = 0 }
               /install-github-app/ && !s { print FILENAME":"FNR": "$0; bad = 1 }
               END { exit bad }' scripts/bootstrap.sh \
            || { echo "::error::bootstrap.sh names /install-github-app outside 'Actions mode with Claude (optional)' (#20)"; fail=1; }
          # #21: actions_agent. claude renders all five Actions workflows; none renders none of them, and no
