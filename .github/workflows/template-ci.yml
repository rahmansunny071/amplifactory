          grep -qx "actions_agent: $want_actions" .copier-answers.yml \
            || { echo "::error::.copier-answers.yml does not record actions_agent: $want_actions (#21)"; fail=1; }
          for w in build chat design label-guard review; do
            if [ "$want_actions" = claude ] && [ ! -f ".github/workflows/factory-$w.yml" ]; then
