name: Template CI

# Renders projects from this Copier template and runs the generated project's own
# checks, so a broken template is caught before anyone generates a repo from it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: with-cli
            real_data: never
            data: --data "description=A demo project."
          - variant: no-cli
            real_data: never
            data: --data "description=A demo project." --data cli_name=
          - variant: custom-python
            real_data: never
            data: >-
              --data "description=An extremely long project description that goes well past one hundred characters so formatting is checked."
              --data 'python_versions=["3.12", "3.13"]' --data python_min=3.12
          # #33: real-data access
          - variant: real-data-with-approval
            real_data: with-approval
            data: --data "description=A demo project." --data real_data_access=with-approval
          - variant: real-data-allowed
            real_data: allowed
            data: --data "description=A demo project." --data real_data_access=allowed
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
      - name: Render
        run: |
          uvx --from 'copier>=9,<10' copier copy --defaults --vcs-ref HEAD \
            --data project_name=demo-${{ matrix.variant }} ${{ matrix.data }} . "$RUNNER_TEMP/out"
      - name: No unrendered template syntax
        working-directory: ${{ runner.temp }}/out
        run: |
          if grep -rnE '\[\[|\]\]|\[%|%\]|\[#' . --exclude=.copier-answers.yml; then
            echo "unrendered Copier syntax left in the generated project" >&2; exit 1
          fi
      - name: Generated YAML parses
        working-directory: ${{ runner.temp }}/out
        run: |
          for f in .github/workflows/*.yml .github/ISSUE_TEMPLATE/*.yml .copier-answers.yml; do
            uvx --from pyyaml python -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f"
          done
      # #91: one job per required check name (a matrix job skipped by if: posts only its unexpanded
      # name), drafts skipped, ready_for_review runs it, and timeouts on every job
      - name: ci.yml has one job per check name, skips drafts, has timeouts
        working-directory: ${{ runner.temp }}/out
        run: |
          uvx --from pyyaml python - <<'PY'
          import sys
          import yaml

          wf = yaml.safe_load(open(".github/workflows/ci.yml"))
          versions = yaml.safe_load(open(".copier-answers.yml"))["python_versions"]
          jobs = wf["jobs"]
          bad = []
          names = sorted(job.get("name", "") for job in jobs.values())
          want = sorted([f"Tests (Python {v})" for v in versions] + ["Lint"])
          if names != want:
              bad.append(f"check names {names}, want {want} (bootstrap's ruleset requires them)")
          # "$" + "{{" keeps GitHub from evaluating it in this live workflow
          gate = "$" + "{{ !github.event.pull_request.draft }}"
          for jid, job in jobs.items():
              if "strategy" in job:
                  bad.append(f"{jid}: a matrix job skipped by if: never posts its check names")
              if job.get("if") != gate:
                  bad.append(f"{jid}: if must be {gate!r}")
              if not isinstance(job.get("timeout-minutes"), int):
                  bad.append(f"{jid}: needs timeout-minutes")
          on = wf.get("on", wf.get(True))
          if "ready_for_review" not in on["pull_request"]["types"]:
              bad.append("pull_request types must include ready_for_review")
          if wf["concurrency"].get("cancel-in-progress") is not True:
              bad.append("concurrency must keep cancel-in-progress")
          for b in bad:
              print(f"::error file=.github/workflows/ci.yml::{b}")
          sys.exit(1 if bad else 0)
          PY
      # Regression guards for lessons learned driving generated factories (amplifactory#3–#7).
      - name: Factory guardrails present
        working-directory: ${{ runner.temp }}/out
        env:
          WANT_REAL_DATA: ${{ matrix.real_data }}
        run: |
          fail=0
          need() { grep -qF -- "$2" "$1" || { echo "::error file=$1::missing: $2"; fail=1; }; }
          need .github/workflows/factory-build.yml  'Design branch only changes .factory/designs/'   # 3
          need .github/workflows/factory-build.yml  'restrict_untrusted_prs: "false"'                # 3
          need .github/workflows/factory-chat.yml   'restrict_untrusted_prs: "false"'                # 3
          need .github/workflows/factory-review.yml 'allowed_bots: "claude"'                         # 5
          need .github/workflows/factory-review.yml 'Bash(gh pr checks:*)'                           # 6
          need .claude/commands/build-from-design.md 'never exit quietly'                            # 3
          need .claude/commands/review-against-design.md 'gh pr checks $ARGUMENTS'                   # 6
          need README.md 'Changing the factory itself'                                               # 4, 7
          # factory skill (v0.2.0)
          for f in SKILL.md references/briefs.md references/gates.md references/issue-format.md scripts/queue.py scripts/runlog.py; do
            test -f ".claude/skills/factory/$f" || { echo "::error::missing .claude/skills/factory/$f"; fail=1; }
          done
          need .claude/skills/factory/SKILL.md 'name: factory'
          need .claude/skills/factory/references/gates.md 'gh pr merge <PR> --merge --admin --delete-branch'
          # #35
          need .claude/skills/factory/scripts/queue.py '"waiting_to_merge"'
          need .claude/skills/factory/references/briefs.md 'Never add the labels `factory:design` or `design:approved`'
          python3 .claude/skills/factory/scripts/queue.py --self-test || fail=1
          # v0.3.0: urgency triage, builder reuse, run log
          need CLAUDE.md '## Release phase'
          need .claude/skills/factory/references/briefs.md 'blocker'
          need .claude/skills/factory/references/briefs.md 'messages to the **same** agent'   # builder reuse (#18 wording)
          need .claude/skills/factory/references/gates.md 'gh run watch'
          need .gitignore '.factory/runs/'
          need scripts/bootstrap.sh 'factory:needs-maintainer factory:ready-to-merge improvement lane P0 P1 P2 P3 '
          need scripts/bootstrap.sh '"required_review_thread_resolution": true'
          # v0.4.0: flag and continue, resume, handoffs, threads gate
          need .claude/skills/factory/SKILL.md '### Flag and continue'
          need .claude/skills/factory/SKILL.md '### Resume'
          need .claude/skills/factory/references/briefs.md '## The Handoff'
          need .claude/skills/factory/references/briefs.md '## Resume builder'
          need .claude/skills/factory/references/gates.md 'All review threads resolved'
          need .claude/skills/factory/references/gates.md 'resolveReviewThread'
          need CLAUDE.md '## Where knowledge lives'
          # v0.5.0: lanes
          need .claude/skills/factory/SKILL.md 'Mode 1: Brainstorm → lanes → issues'
          need .claude/skills/factory/SKILL.md '### Parallel lanes'
          need .claude/skills/factory/references/issue-format.md '## Lane issue'
          need scripts/bootstrap.sh 'gh project field-create'
          # under pipefail, a pipe ending in grep -q fails when the writer gets SIGPIPE (the 'project'
          # scope check read as missing). Comments are skipped.
          if grep -nE '^[^#]*\|[[:space:]]*grep[^|]* -[a-zA-Z]*q' scripts/bootstrap.sh; then
            echo "::error::scripts/bootstrap.sh ends a pipe in grep -q, which breaks under pipefail"; fail=1
          fi
          # a re-run, or adopting into an existing repo, never force-pushes over origin/main (#70)
          need scripts/bootstrap.sh 'git merge-base --is-ancestor origin/main main'
          # gate 1 watches the run for the PR's head commit; stacked PRs move to main before a merge
          need .claude/skills/factory/references/gates.md "gh run list -R <owner/repo> --commit <sha>"
          need .claude/skills/factory/references/gates.md 'git diff --cached --check'
          need .claude/skills/factory/references/gates.md '**Stacked PRs first.**'
          test -f .claude/skills/factory/scripts/lanes.py || { echo "::error::missing lanes.py"; fail=1; }
          python3 .claude/skills/factory/scripts/lanes.py --self-test || fail=1
          # v0.6.0: docs ship with the code; Documentation tech-debt tracker (#30)
          need CLAUDE.md 'Every code change ships its docs in the same PR'
          need CLAUDE.md 'sub-issues of the "Documentation'
          need scripts/bootstrap.sh 'DOC_DEBT_TITLE="Documentation tech-debt"'
          need scripts/bootstrap.sh 'P0 P1 P2 P3 documentation)'
          need .claude/skills/factory/scripts/lanes.py 'DOC_DEBT_TITLE = "Documentation tech-debt"'
          need .claude/skills/factory/scripts/queue.py 'DOC_DEBT_TITLE = "Documentation tech-debt"'
          need .claude/skills/factory/SKILL.md 'lanes.py doc-debt find'
          need .claude/skills/factory/references/briefs.md '**Docs:**'
          need .claude/skills/factory/references/briefs.md '[doc-debt]'
          need .claude/skills/factory/references/gates.md 'Docs ship with the code'
          need .claude/commands/build-from-design.md '## Docs'
          need .claude/commands/review-against-design.md 'Docs vs code'
          if grep -q 'Every user-visible change updates README.md and CHANGELOG.md' CLAUDE.md; then
            echo "::error::the old docs rule was replaced in v0.6.0"; fail=1
          fi
          # #32: ready-to-merge hand-off
          need scripts/bootstrap.sh 'factory:ready-to-merge'
          need .claude/skills/factory/SKILL.md '### Ready to merge and continue'
          need .claude/skills/factory/SKILL.md 'work around a refusal'
          need .claude/skills/factory/references/gates.md 'Ready to merge: all gates pass on'
          need .claude/skills/factory/references/gates.md 'gh pr merge <PR> --merge --delete-branch'
          need .claude/skills/factory/scripts/queue.py 'READY_TO_MERGE = "factory:ready-to-merge"'
          # #41: factory-lesson
          test -f .claude/skills/factory-lesson/SKILL.md || { echo "::error::missing factory-lesson/SKILL.md"; fail=1; }
          need .claude/skills/factory-lesson/SKILL.md 'name: factory-lesson'
          need .claude/skills/factory-lesson/SKILL.md 'gh repo view'
          need .claude/skills/factory-lesson/SKILL.md '--label lesson'
          need .claude/skills/factory-lesson/SKILL.md 'no real data values'
          need .claude/skills/factory-lesson/SKILL.md 'Create nothing until the user says yes'
          need .claude/skills/factory/SKILL.md '`factory-lesson` skill'
          # #47: closed-lesson dedupe and re-check after edits
          need .claude/skills/factory-lesson/SKILL.md '--label lesson --state all'
          need .claude/skills/factory-lesson/SKILL.md 'Closed match'
          need .claude/skills/factory-lesson/SKILL.md 're-run the step 5 privacy check on the edited text'
          need README.md 'Letting the factory merge for you'
          need README.md 'Bash(gh pr merge * --merge --admin --delete-branch)'
          if grep -rq 'gh pr merge' .claude/settings.json .claude/settings.local.json 2>/dev/null; then
            echo "::error::the template must not ship a gh pr merge allow rule (opt-in only)"; fail=1
          fi
          # skill PRs (local/issue-N) must not trigger the Actions review (factory/issue-*)
          need .claude/skills/factory/SKILL.md '-b local/issue-N'
          need .github/workflows/factory-review.yml "startsWith(github.event.pull_request.head.ref, 'factory/issue-')"
          if grep -q 'factory/issue-' .claude/skills/factory/references/briefs.md; then echo "::error::skill briefs must use local/issue-N branches"; fail=1; fi
          if grep -q 'ask once whether to' .claude/skills/factory/SKILL.md; then echo "::error::the per-run Actions-review question was removed in v0.3.1"; fail=1; fi
          if grep -q 'sleep ' .claude/skills/factory/references/gates.md; then echo "::error::gates.md must not use sleep loops"; fail=1; fi
          uv run --no-project --python 3.12 python .claude/skills/factory/scripts/runlog.py --self-test || fail=1
          # the review job must stay read-only and restricted
          if grep -q 'restrict_untrusted_prs' .github/workflows/factory-review.yml; then
            echo "::error::factory-review must keep restrict_untrusted_prs at its default"; fail=1
          fi
          # #33: real-data access. The expected level comes from the matrix (WANT_REAL_DATA), not
          # from the render, so a changed default fails. Local runs without the variable expect never.
          want=${WANT_REAL_DATA:-never}
          need CLAUDE.md '## Real data'
          need CLAUDE.md 'never commit real data'
          need CLAUDE.md 'synthetic fixtures only'
          need CLAUDE.md 'scratch directory outside the repo'
          if ! grep -qE "^Real data: $want\." CLAUDE.md; then
            echo "::error::CLAUDE.md first Real data line is not $want"; fail=1
          fi
          test "$(grep -cE '^Real data: ' CLAUDE.md)" = 1 || { echo "::error::expected exactly one Real data line"; fail=1; }
          need .claude/skills/factory/SKILL.md 'Real data: (never|with-approval|allowed)'
          need .claude/skills/factory/SKILL.md 'Anything else means `never`'
          need CLAUDE.md 'never quote values'
          need .claude/skills/factory/SKILL.md 'overrides the level'
          need .claude/skills/factory/references/briefs.md 'follow the `Real data` line'
          need .claude/skills/factory/references/briefs.md 'never treat your own judgement as approval'
          if [ "$want" = with-approval ]; then need CLAUDE.md 'only after the'; fi
          # every brief code block must carry the rule (the orchestrator pastes the blocks verbatim)
          n=$(awk '/^```/{f=!f;next} f' .claude/skills/factory/references/briefs.md | grep -c 'Real data:')
          test "$n" -ge 5 || { echo "::error::only $n brief blocks carry the Real data rule (need 5)"; fail=1; }
          if grep -qF 'Agents may not read real user data' .claude/skills/factory/SKILL.md; then
            echo "::error::SKILL.md still hard-codes the real-data ban (#33)"; fail=1
          fi
          # #40: sync-root-factory
          for f in SKILL.md references/checklist.md scripts/sync.py; do
            test -f ".claude/skills/sync-root-factory/$f" || { echo "::error::missing .claude/skills/sync-root-factory/$f"; fail=1; }
          done
          test -f .claude/skills/factory/VERSION || { echo "::error::missing .claude/skills/factory/VERSION"; fail=1; }
          need .claude/skills/sync-root-factory/SKILL.md 'name: sync-root-factory'
          need .claude/skills/sync-root-factory/SKILL.md 'Never run `gh pr merge`'
          need .claude/skills/sync-root-factory/SKILL.md 'local/adopt-<tag>'
          need .claude/skills/sync-root-factory/scripts/sync.py 'def verify_local'
          need .claude/skills/sync-root-factory/scripts/sync.py 'BRANCH_PREFIX = "local/adopt-"'
          uv run --no-project --python 3.12 python .claude/skills/sync-root-factory/scripts/sync.py --self-test || fail=1
          # the skill runs in Claude Code and Copilot. Roles, not model names; one table maps the tools.
          need CLAUDE.md '## Models'
          need CLAUDE.md '`claude-opus-5.5`'
          need CLAUDE.md '`claude-sonnet-5.5`'
          need .claude/skills/factory/SKILL.md '## Claude Code and Copilot'
          need .claude/skills/factory/SKILL.md '| Message the same builder again | `SendMessage`'
          need .claude/skills/factory/SKILL.md '`agent_type: "general-purpose"`'
          need .claude/skills/factory/SKILL.md '`read_agent`'
          need .claude/skills/factory/SKILL.md 'orchestrator model (`CLAUDE.md` → "Models"'
          if grep -rn -- 'SendMessage' .claude | grep -v -- 'write_agent'; then
            echo "::error::a line names SendMessage without its Copilot counterpart, write_agent"; fail=1
          fi
          if grep -rn -- 'AskUserQuestion' .claude | grep -v -- 'ask_user'; then
            echo "::error::a line names AskUserQuestion without its Copilot counterpart, ask_user"; fail=1
          fi
          if grep -nwiE 'opus|sonnet|haiku' .claude/skills/factory/references/briefs.md; then
            echo "::error::briefs.md names a model; name the role (CLAUDE.md → Models)"; fail=1
          fi
          if grep -rnE 'model: "(opus|sonnet|haiku)"|\((Opus|Sonnet)\)' .claude; then
            echo "::error::a skill hard-codes a Claude Code model"; fail=1
          fi
          exit $fail
      - name: skill scripts run on Python 3.9 (macOS system python3)
        working-directory: ${{ runner.temp }}/out
        run: |
          fail=0
          for s in factory/scripts/queue factory/scripts/lanes factory/scripts/runlog sync-root-factory/scripts/sync; do
            uv run --no-project --python 3.9 python ".claude/skills/$s.py" --self-test || fail=1
          done
          exit $fail
      - name: bootstrap.sh is executable and parses
        working-directory: ${{ runner.temp }}/out
        run: test -x scripts/bootstrap.sh && bash -n scripts/bootstrap.sh
      - name: Generated project's checks (same as its ci.yml)
        working-directory: ${{ runner.temp }}/out
        run: |
          uv lock
          for py in $(uvx --from pyyaml python -c "import yaml; print(' '.join(yaml.safe_load(open('.copier-answers.yml'))['python_versions']))"); do
            uv sync --locked --extra dev --python "$py"
            uv run --no-sync pytest -q
          done
          ruff=$(uvx --from pyyaml python -c "import yaml; print(yaml.safe_load(open('.copier-answers.yml'))['ruff_version'])")
          uvx "ruff@$ruff" format --check .
          uvx "ruff@$ruff" check .

      # project_name defaults to the destination folder's name, so the cd line and the repo bootstrap
      # creates agree; the message names the repo when they differ
      - name: Copier's after-copy message matches the folder name
        if: matrix.variant == 'with-cli'
        run: |
          fail=0
          uvx --from 'copier>=9,<10' copier copy --defaults --vcs-ref HEAD --data "description=x" \
            . "$RUNNER_TEMP/My_Folder-x" > "$RUNNER_TEMP/msg.txt" 2>&1
          grep -qxF 'project_name: my-folder-x' "$RUNNER_TEMP/My_Folder-x/.copier-answers.yml" \
            || { echo "::error::project_name did not default to the kebab-cased folder name"; fail=1; }
          if grep -q 'bootstrap creates the GitHub repo' "$RUNNER_TEMP/msg.txt"; then
            echo "::error::the message warns of a folder/repo mismatch when the name is the default"; fail=1
          fi
          uvx --from 'copier>=9,<10' copier copy --defaults --vcs-ref HEAD --data "description=x" \
            --data project_name=other . "$RUNNER_TEMP/diff-folder" > "$RUNNER_TEMP/msg2.txt" 2>&1
          grep -qF 'rahmansunny071/other' "$RUNNER_TEMP/msg2.txt" \
            || { echo "::error::the message doesn't name the repo when it differs from the folder"; fail=1; }
          # copying into . (how an existing repo adopts the template) names it after the folder too
          src=$PWD
          mkdir -p "$RUNNER_TEMP/Dot_Repo"
          (cd "$RUNNER_TEMP/Dot_Repo" && uvx --from 'copier>=9,<10' copier copy --defaults --vcs-ref HEAD \
            --data "description=x" "$src" . > "$RUNNER_TEMP/msg3.txt" 2>&1)
          grep -qxF 'project_name: dot-repo' "$RUNNER_TEMP/Dot_Repo/.copier-answers.yml" \
            || { echo "::error::copying into . did not default project_name to the folder name"; fail=1; }
          exit $fail

  # scripts/check.sh's own tests (scripts/test-check.sh), against fake repos. check.sh is the local
  # "checks pass", so a change that breaks it must fail here too. On macOS they also run under
  # /bin/bash, macOS's bash 3.2, which check.sh supports.
  check-sh:
    name: scripts/check.sh's tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # each step says which bash it ran, so a host whose PATH bash is /bin/bash shows it
      - name: scripts/test-check.sh
        run: bash -c 'echo "bash $BASH_VERSION"' && bash scripts/test-check.sh
      - name: scripts/test-check.sh under /bin/bash (macOS's bash 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash -c 'echo "bash $BASH_VERSION"' && /bin/bash scripts/test-check.sh

  # #40: sync-root-factory. Shadowing repos read the skill's VERSION file, so it must name the
  # release the tag points at. The release PR renames the Unreleased entry and bumps VERSION together.
  version:
    name: VERSION matches the changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: factory/VERSION equals the first released changelog bullet
        run: |
          # the first bullet that starts with "- v" (Unreleased is skipped); "- v0.8.0:" counts
          want=$(grep -m1 -E '^- v' CHANGELOG.md | sed -nE 's/^- v([0-9]+\.[0-9]+\.[0-9]+)([^0-9.].*)?$/\1/p')
          have=$(tr -d '[:space:]' < template/.claude/skills/factory/VERSION)
          echo "CHANGELOG says $want, VERSION says $have"
          test -n "$want" && test "$want" = "$have" || { echo "::error::template/.claude/skills/factory/VERSION must equal the first '- vX.Y.Z' CHANGELOG bullet"; exit 1; }
