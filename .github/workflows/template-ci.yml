          need .claude/skills/factory-lesson/SKILL.md 'name: factory-lesson'
          need .claude/skills/factory-lesson/SKILL.md 'gh repo view'
          need .claude/skills/factory-lesson/SKILL.md '--label lesson'
          need .claude/skills/factory-lesson/SKILL.md 'no real data values'
          need .claude/skills/factory-lesson/SKILL.md 'Create nothing until the user says yes'
          need .claude/skills/factory/SKILL.md '`factory-lesson` skill'
          # #47: closed-lesson dedupe and re-check after edits
