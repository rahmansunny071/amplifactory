          done
          if [ "$want_actions" = none ] && grep -rnE '@claude|install-github-app|CLAUDE_CODE_OAUTH_TOKEN|copilot-requests|can_approve_pull_request_reviews' README.md CLAUDE.md scripts/bootstrap.sh .github; then
            echo "::error::actions_agent=none, but the lines above mention an Actions mode (#21, #40)"; fail=1
          fi
          # #94: the opt-in local CI runner pool (factory-ci); its self-tests also run containers.py's and guard.py's
          test -f .claude/skills/factory-ci/scripts/runners.py || { echo "::error::missing .claude/skills/factory-ci/scripts/runners.py"; fail=1; }
          need .claude/skills/factory-ci/scripts/runners.py 'ACTIONS_RUNNER_HOOK_JOB_STARTED'
          need .claude/skills/factory-ci/scripts/runners.py '"runner_group_id": 1'
          need .claude/skills/factory-ci/scripts/runners.py 'def refusal'
          uv run --no-project --python 3.12 python .claude/skills/factory-ci/scripts/runners.py --self-test || fail=1
          test -f .claude/skills/factory-ci/scripts/setup.py || { echo "::error::missing .claude/skills/factory-ci/scripts/setup.py"; fail=1; }
          uv run --no-project --python 3.12 python .claude/skills/factory-ci/scripts/setup.py --self-test || fail=1
          # the factory-ci skill, the factory's step 0 (GitHub-hosted by default, the pool opt-in), the setup hint
          need .claude/skills/factory-ci/SKILL.md 'name: factory-ci'
          need .claude/skills/factory-ci/SKILL.md 'setup.py plan'
          need .claude/skills/factory/SKILL.md 'factory-ci/scripts/setup.py doctor'
          need .claude/skills/factory/SKILL.md 'CI runs on GitHub-hosted runners, the default. Go on, and don'"'"'t ask.'
          need scripts/bootstrap.sh 'sets up CI on'
          exit $fail
      - name: skill scripts run on Python 3.9 (macOS system python3)
        working-directory: ${{ runner.temp }}/out
        run: |
          fail=0
          for s in factory/scripts/queue factory/scripts/lanes factory/scripts/runlog factory/scripts/merge_hook sync-root-factory/scripts/sync factory-ci/scripts/runners factory-ci/scripts/setup; do
            uv run --no-project --python 3.9 python ".claude/skills/$s.py" --self-test || fail=1
          done
          exit $fail
      - name: bootstrap.sh is executable and parses
        working-directory: ${{ runner.temp }}/out
        run: test -x scripts/bootstrap.sh && bash -n scripts/bootstrap.sh
      - name: Generated project's checks (same as its ci.yml)
        working-directory: ${{ runner.temp }}/out
        run: |
          uv lock
          for py in $(uvx --from pyyaml python -c "import yaml; print(' '.join(yaml.safe_load(open('.copier-answers.yml'))['python_versions']))"); do
            uv sync --locked --extra dev --python "$py"
            uv run --no-sync pytest -q
          done
          ruff=$(uvx --from pyyaml python -c "import yaml; print(yaml.safe_load(open('.copier-answers.yml'))['ruff_version'])")
          uvx "ruff@$ruff" format --check .
          uvx "ruff@$ruff" check .

      # #20: Copier's after-copy message (not part of the render): Copilot first, Claude Code as the

      # project_name defaults to the destination folder's name, so the cd line and the repo bootstrap
      # creates agree; the message names the repo when they differ
      - name: Copier's after-copy message matches the folder name
        if: matrix.variant == 'with-cli'
        run: |
          fail=0
          uvx --from 'copier>=9,<10' copier copy --defaults --vcs-ref HEAD --data "description=x" \
            . "$RUNNER_TEMP/My_Folder-x" > "$RUNNER_TEMP/msg.txt" 2>&1
          grep -qxF 'project_name: my-folder-x' "$RUNNER_TEMP/My_Folder-x/.copier-answers.yml" \
            || { echo "::error::project_name did not default to the kebab-cased folder name"; fail=1; }
          if grep -q 'bootstrap creates the GitHub repo' "$RUNNER_TEMP/msg.txt"; then
            echo "::error::the message warns of a folder/repo mismatch when the name is the default"; fail=1
          fi
          uvx --from 'copier>=9,<10' copier copy --defaults --vcs-ref HEAD --data "description=x" \
            --data project_name=other . "$RUNNER_TEMP/diff-folder" > "$RUNNER_TEMP/msg2.txt" 2>&1
          grep -qF 'rahmansunny071/other' "$RUNNER_TEMP/msg2.txt" \
            || { echo "::error::the message doesn't name the repo when it differs from the folder"; fail=1; }
          # copying into . (how an existing repo adopts the template) names it after the folder too
          src=$PWD
          mkdir -p "$RUNNER_TEMP/Dot_Repo"
          (cd "$RUNNER_TEMP/Dot_Repo" && uvx --from 'copier>=9,<10' copier copy --defaults --vcs-ref HEAD \
            --data "description=x" "$src" . > "$RUNNER_TEMP/msg3.txt" 2>&1)
          grep -qxF 'project_name: dot-repo' "$RUNNER_TEMP/Dot_Repo/.copier-answers.yml" \
            || { echo "::error::copying into . did not default project_name to the folder name"; fail=1; }
          exit $fail

  # scripts/check.sh's own tests (scripts/test-check.sh), against fake repos. check.sh is the local
  # "checks pass", so a change that breaks it must fail here too. On macOS they also run under
  # /bin/bash, macOS's bash 3.2, which check.sh supports.
  check-sh:
    name: scripts/check.sh's tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # each step says which bash it ran, so a host whose PATH bash is /bin/bash shows it
      - name: scripts/test-check.sh
        run: bash -c 'echo "bash $BASH_VERSION"' && bash scripts/test-check.sh
      - name: scripts/test-check.sh under /bin/bash (macOS's bash 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash -c 'echo "bash $BASH_VERSION"' && /bin/bash scripts/test-check.sh

  # #40: sync-root-factory. Shadowing repos read the skill's VERSION file, so it must name the
  # release the tag points at. The release PR renames the Unreleased entry and bumps VERSION together.
  version:
    name: VERSION matches the changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: factory/VERSION equals the first released changelog bullet
        run: |
          # the first bullet that starts with "- v" (Unreleased is skipped); "- v0.8.0:" counts
          want=$(grep -m1 -E '^- v' CHANGELOG.md | sed -nE 's/^- v([0-9]+\.[0-9]+\.[0-9]+)([^0-9.].*)?$/\1/p')
          have=$(tr -d '[:space:]' < template/.claude/skills/factory/VERSION)
          echo "CHANGELOG says $want, VERSION says $have"
          test -n "$want" && test "$want" = "$have" || { echo "::error::template/.claude/skills/factory/VERSION must equal the first '- vX.Y.Z' CHANGELOG bullet"; exit 1; }
