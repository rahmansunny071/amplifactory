            ("review", sh("gh pr review 5 --comment --body-file - <<'EOF'\n**Design conformance:** ✅ `x` $y\nEOF"), ok),
            ("review", sh("gh pr comment 5 --body 'ok'"), ok),
            ("review", sh("gh pr merge 5"), no),
            ("review", sh("gh pr close 5"), no),
            ("review", sh("gh pr edit 5 --add-label design:approved"), no),
            ("review", sh("git push"), no),
            ("review", sh("uv run --no-sync pytest"), no),
