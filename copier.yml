# amplifactory: a Copier template for an issue-driven agent factory. The factory
# skill runs in GitHub Copilot or Claude Code; an optional Actions mode runs it on
# GitHub Actions, with Claude Code (actions_agent: claude) or the GitHub Copilot CLI
# (actions_agent: copilot); off by default; design → maintainer approval → build → review.
#
#   copier copy gh:rahmansunny071/amplifactory my-project
#   cd my-project && ./scripts/bootstrap.sh --public
#
# Copier variables use [[ ... ]] (and [% ... %] for blocks), so GitHub Actions
# expressions like ${{ github.event.issue.number }} pass through untouched.

_min_copier_version: "9.5"  # _folder_name (project_name's default)
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"
  keep_trailing_newline: true

# ---------------------------------------------------------------- project
project_name:
  type: str
  help: Repository and distribution name (kebab-case, e.g. pensieve-traces)
  default: "[[ (_folder_name or 'project')|lower|regex_replace('[^a-z0-9]+', '-')|trim('-') ]]"
  validator: >-
    [% if not project_name or project_name != project_name|lower or ' ' in project_name or '_' in project_name %]
    Use kebab-case: lowercase letters, digits and hyphens
    [% endif %]

package_name:
  type: str
  help: Python import name
  default: "[[ project_name|replace('-', '_') ]]"

cli_name:
  type: str
  help: CLI command name (leave empty for a library with no CLI)
  default: "[[ project_name ]]"

description:
  type: str
  help: One-sentence description (pyproject, GitHub, README tagline)

agent_context:
  type: str
  multiline: true
  help: >-
    What the project is, for the agents: one or two paragraphs at the top of
    CLAUDE.md (purpose, architecture, key modules)
  default: "[[ description ]]"

extra_hard_rules:
  type: str
  multiline: true
  help: >-
    Project-specific hard rules for CLAUDE.md, one "- " bullet per rule
    (data, privacy, specs, ...). Generic factory rules are always included.
  default: ""

design_risks:
  type: str
  help: What every design's "Risks" section must cover
  default: >-
    privacy and data (no secrets or personal data in the repo), licensing of
    data and dependencies, new or heavy dependencies (prefer optional extras),
    docs impact

issue_areas:
  type: yaml
  help: Options for the "Areas affected" dropdown in the Factory task issue template
  default: "[core, cli, docs, tests, none]"

# ---------------------------------------------------------------- people
maintainer_github:
  type: str
  help: GitHub login of the only person who can start, approve or merge factory work
  default: rahmansunny071

author_name:
  type: str
  default: Sajjadur Rahman

author_email:
  type: str
  default: rahmansunny071@gmail.com

homepage:
  type: str
  default: https://sajjadur.net/

# ---------------------------------------------------------------- toolchain
python_min:
  type: str
  help: Minimum supported Python (requires-python)
  default: "3.11"

python_versions:
  type: yaml
  help: Python versions tested in CI (each becomes a required check "Tests (Python X)")
  default: '["3.11", "3.12"]'

ruff_version:
  type: str
  help: Pinned ruff version (its default rules change between releases)
  default: "0.17.4"

release_phase:
  type: str
  help: >-
    mvp until the first formal release (fix only blockers in-PR; everything else becomes an
    improvement issue), then hardening (thorough reviews and re-reviews)
  choices: [mvp, hardening]
  default: mvp

real_data_access:
  type: str
  help: >-
    Whether agents may read your real data. never: you run shapes-only scripts and reply with the
    output. with-approval: agents ask first, per issue, then read locally. allowed: agents read
    locally when a task needs it. Real data is never committed or quoted at any level.
  choices: [never, with-approval, allowed]
  default: never

actions_agent:
  type: str
  help: >-
    The GitHub Actions mode, where labels you add start design, build and review agents on GitHub
    runners. none: no agent workflows; you run the factory skill in GitHub Copilot or Claude Code.
    claude: Claude Code GitHub Actions (needs a Claude subscription). copilot: the GitHub Copilot CLI,
    signed in with each workflow's own token (no secret; bills the repo owner's Copilot seat).
  choices: [none, claude, copilot]
  # A new project gets none. A project generated before this question recorded agent_model (asked
  # after this question, so a new project hasn't answered it yet): there the default is claude, so
  # `copier update` keeps its workflows instead of deleting them. (Copier's _copier_operation is not
  # available to question defaults, only to tasks and _exclude.)
  default: "[[ 'claude' if agent_model is defined else 'none' ]]"

claude_actions:
  # computed, never asked or recorded: whether the Claude Actions-mode files are rendered
  type: bool
  when: false
  default: "[[ actions_agent == 'claude' ]]"

copilot_actions:
  # computed, never asked or recorded: whether the Copilot Actions-mode files are rendered
  type: bool
  when: false
  default: "[[ actions_agent == 'copilot' ]]"

actions_mode:
  # computed, never asked or recorded: whether either Actions mode is on (the files they share)
  type: bool
  when: false
  default: "[[ actions_agent != 'none' ]]"

agent_model:
  type: str
  when: "[[ actions_agent == 'claude' ]]"
  help: >-
    Model for the Actions-mode agents (Claude Code GitHub Actions; sonnet is the sensible
    default on Pro). The factory skill's models are in the generated CLAUDE.md → Models.
  choices: [sonnet, opus, haiku]
  default: sonnet

copilot_model:
  type: str
  when: "[[ actions_agent == 'copilot' ]]"
  help: >-
    Model for the Actions-mode agents (copilot --model): any model your Copilot plan offers
    (`copilot help config` lists them). The factory skill's models are in the generated CLAUDE.md →
    Models.
  default: claude-sonnet-5.5
  validator: >-
    [% if not copilot_model or copilot_model | regex_search('[^A-Za-z0-9._-]') %]
    Use a model name: letters, digits, dots, hyphens and underscores
    [% endif %]

_message_after_copy: |
  Generated [[ project_name ]].

  Next steps:
    cd [[ _copier_conf.dst_path ]]
    gh auth refresh -h github.com -s repo,workflow,project
        # repo: create and push the repo; workflow: push the Actions workflows;
        # project: the Project board (bootstrap and lanes.py project-add)
    ./scripts/bootstrap.sh --public     # or --private: EMU (enterprise-managed) accounts can only
                                        # create private repos; rulesets on private repos need a
                                        # plan that supports them
    copilot                             # GitHub Copilot CLI (or the Copilot app), or claude for
                                        # Claude Code; on the orchestrator model in CLAUDE.md →
                                        # Models, say "brainstorm X into issues" or "run the factory"
  The factory skill works from there and needs no secret.
  [%- if (_folder_name or 'project')|lower|regex_replace('[^a-z0-9]+', '-')|trim('-') != project_name %]
  The folder is named [[ _folder_name ]], but bootstrap creates the GitHub repo
  [[ maintainer_github ]]/[[ project_name ]].
  [%- endif %]
  [%- if actions_agent == 'claude' %]

  Actions mode with Claude (optional, last; agents on GitHub runners):
    in Claude Code, /install-github-app → pick [[ maintainer_github ]]/[[ project_name ]]
    → choose your subscription; decline the installer's own claude.yml workflows
    dry run: open an issue with the Factory task template and add factory:design
  [%- elif actions_agent == 'copilot' %]

  Actions mode with Copilot (optional, last; agents on GitHub runners, no secret):
    bootstrap lets workflows open PRs; the agents bill your Copilot seat
    dry run: open an issue with the Factory task template and add factory:design
  [%- else %]

  The GitHub Actions mode is off (actions_agent: none). To add it later, in a PR of its own:
    uvx copier update --data actions_agent=copilot    # or actions_agent=claude
  [%- endif %]

_message_after_update: |
  [% if actions_agent == 'copilot' -%]
  Actions mode with Copilot: its agents open PRs with the workflows' own token, which needs
  "Allow GitHub Actions to create and approve pull requests" (Settings → Actions → General).
  Bootstrap turns it on for a new repo. If this update added the mode, turn it on:
    gh api -X PUT repos/[[ maintainer_github ]]/[[ project_name ]]/actions/permissions/workflow -F can_approve_pull_request_reviews=true
  [%- endif %]
